<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>「我」字拼图游戏</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f0efe8; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
#toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; background: #fff;
  border-bottom: 1px solid #ddd; flex-wrap: wrap;
}
.btn {
  padding: 6px 12px; border: 1px solid #ccc; border-radius: 8px;
  background: #f5f5f5; color: #333; cursor: pointer;
  font-size: 13px; white-space: nowrap;
}
.btn:hover { background: #e8e8e8; }
.btn.active { background: #534AB7; color: #fff; border-color: #534AB7; }
.btn.green { background: #1D9E75; color: #fff; border-color: #1D9E75; }
.sep { width: 1px; height: 24px; background: #ddd; flex-shrink: 0; }
#stage {
  position: relative; width: 100%; height: calc(100vh - 60px);
  overflow: hidden; background: #e8e8de;
}
/* 画笔层：在最上面，仅画笔/橡皮模式才激活 */
#paintCanvas {
  position: absolute; inset: 0; z-index: 20;
  pointer-events: none; cursor: crosshair;
}
/* 碎片 */
.piece {
  position: absolute; z-index: 10;
  cursor: grab; user-select: none; touch-action: none;
}
.piece:active { cursor: grabbing; }
.piece-img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none; display: block;
}
.piece-color {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none;
  mix-blend-mode: multiply;
}
/* 颜色选择弹窗 */
#cpopup {
  display: none; position: fixed; z-index: 200;
  background: #fff; border: 1px solid #ccc; border-radius: 10px;
  padding: 12px; flex-direction: column; gap: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}
#cpopup.show { display: flex; }
.color-grid { display: grid; grid-template-columns: repeat(6, 28px); gap: 5px; }
.color-dot {
  width: 28px; height: 28px; border-radius: 50%;
  cursor: pointer; border: 2px solid transparent;
  transition: transform .1s;
}
.color-dot:hover { transform: scale(1.2); }
.color-dot.selected { border-color: #333; }
/* 展示层 */
#showcase {
  display: none; position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,.88);
  align-items: center; justify-content: center; flex-direction: column; gap: 16px;
}
#showcase.show { display: flex; }
#showcase h2 { color: #fff; font-size: 22px; }
#showcase canvas { background: #fff; border-radius: 8px; max-width: 90vw; max-height: 70vh; }
#showcase button { padding: 8px 24px; border: 1px solid rgba(255,255,255,.4); border-radius: 8px; color: #fff; background: transparent; cursor: pointer; font-size: 14px; }
/* 颜色预览点 */
#brushPreview { width: 16px; height: 16px; border-radius: 50%; background: #E24B4A; flex-shrink: 0; border: 1px solid rgba(0,0,0,.2); }
</style>
</head>
<body>

<div id="toolbar">
  <span id="modeLabel" style="font-size:13px;color:#666;min-width:60px;">移动碎片</span>
  <div class="sep"></div>
  <button class="btn active" id="btnMove" onclick="setMode('move')">移动碎片</button>
  <button class="btn" id="btnBrush" onclick="setMode('brush')">✏️ 画笔</button>
  <button class="btn" id="btnErase" onclick="setMode('erase')">🧹 橡皮</button>
  <div class="sep"></div>
  <span style="font-size:13px;color:#666;">粗细</span>
  <input type="range" id="brushSize" min="3" max="40" value="10" step="1" style="width:80px;">
  <div id="brushPreview"></div>
  <div class="sep"></div>
  <div id="swatchRow" style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;"></div>
  <input type="color" id="customColor" value="#E24B4A" title="自定义颜色" style="width:28px;height:26px;border:none;cursor:pointer;border-radius:4px;flex-shrink:0;">
  <div class="sep"></div>
  <button class="btn" onclick="clearCanvas()">🗑 清空画笔</button>
  <div class="sep"></div>
  <button class="btn" onclick="shiftBoard(-80)">↑ 上移白板</button>
  <button class="btn" onclick="shiftBoard(80)">↓ 下移白板</button>
  <div class="sep"></div>
  <button class="btn green" onclick="showShowcase()">🎨 展示成品</button>
</div>

<div id="stage">
  <canvas id="paintCanvas"></canvas>
</div>

<!-- 碎片涂色弹窗 -->
<div id="cpopup">
  <div style="font-size:13px;color:#555;">为这块碎片填色</div>
  <div class="color-grid" id="cpColorGrid"></div>
  <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:#555;">
    自定义颜色
    <input type="color" id="cpCustomColor" value="#E24B4A" style="width:32px;height:26px;border:none;cursor:pointer;border-radius:4px;">
  </div>
  <button class="btn" onclick="clearPiece(currentPiece)">清除碎片颜色</button>
</div>

<!-- 展示界面 -->
<div id="showcase">
  <h2>我们共同的「我」✨</h2>
  <canvas id="showcaseCanvas"></canvas>
  <button onclick="closeShowcase()">关闭</button>
</div>

const COLORS = [
  "#E24B4A","#EF9F27","#639922","#1D9E75","#378ADD","#7F77DD",
  "#D4537E","#D85A30","#5DCAA5","#FAC775","#f97316","#ec4899",
  "#000000","#555555","#aaaaaa","#ffffff"
];

let mode = "move";
let brushColor = "#E24B4A";
let brushSize = 10;
let painting = false;
let lastPt = null;
let boardShift = 0;
let showcaseDone = false;
let currentPiece = null;

const stage = document.getElementById("stage");
const paintCanvas = document.getElementById("paintCanvas");
const pCtx = paintCanvas.getContext("2d");

// 初始化画布尺寸
function resizePaintCanvas() {
  const w = stage.offsetWidth, h = stage.offsetHeight;
  // 保留内容
  const tmp = document.createElement("canvas");
  tmp.width = w; tmp.height = h;
  tmp.getContext("2d").drawImage(paintCanvas, 0, 0);
  paintCanvas.width = w;
  paintCanvas.height = h;
  pCtx.drawImage(tmp, 0, 0);
}
setTimeout(resizePaintCanvas, 50);
window.addEventListener("resize", resizePaintCanvas);

// ===== 碎片管理 =====
const pieces = [];

function buildPieces() {
  const stW = stage.offsetWidth || 900;
  const stH = stage.offsetHeight || 600;
  const pSize = Math.min(200, Math.floor(Math.min(stW, stH) / 3.2));
  const rightX = stW - pSize - 15;

  const positions = [
    { x: 15, y: 10 },
    { x: 15, y: pSize + 20 },
    { x: 15, y: pSize * 2 + 30 },
    { x: rightX, y: 10 },
    { x: rightX, y: pSize + 20 },
    { x: rightX, y: pSize * 2 + 30 },
  ];

  PIECE_SRCS.forEach((src, i) => {
    const wrap = document.createElement("div");
    wrap.className = "piece";
    wrap.style.width = pSize + "px";
    wrap.style.height = pSize + "px";
    wrap.style.left = positions[i].x + "px";
    wrap.style.top = positions[i].y + "px";

    // 颜色层（在图片下方，用 multiply 混合）
    const colorCanvas = document.createElement("canvas");
    colorCanvas.className = "piece-color";
    colorCanvas.width = pSize;
    colorCanvas.height = pSize;

    // 图片层
    const img = document.createElement("img");
    img.className = "piece-img";
    img.src = src;

    wrap.appendChild(colorCanvas);
    wrap.appendChild(img);
    stage.insertBefore(wrap, paintCanvas); // 插在画笔层之前

    const piece = {
      el: wrap, img, colorCanvas,
      colorCtx: colorCanvas.getContext("2d"),
      pSize, idx: i
    };
    pieces.push(piece);
    bindPieceDrag(wrap, i);
  });
}

function bindPieceDrag(el, idx) {
  let startX, startY, startLeft, startTop, dragging = false, moved = false;

  const onDown = (cx, cy) => {
    if (showcaseDone) return;
    if (mode !== "move") return; // 画笔模式不能拖
    dragging = true; moved = false;
    startX = cx; startY = cy;
    startLeft = parseInt(el.style.left) || 0;
    startTop = parseInt(el.style.top) || 0;
    el.style.zIndex = 50;
  };

  const onMove = (cx, cy) => {
    if (!dragging) return;
    const dx = cx - startX, dy = cy - startY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
    el.style.left = (startLeft + dx) + "px";
    el.style.top = (startTop + dy) + "px";
  };

  const onUp = (cx, cy) => {
    if (!dragging) return;
    dragging = false;
    el.style.zIndex = 10;
    if (!moved) {
      // 短点击 = 打开涂色弹窗
      openColorPopup(idx, cx, cy);
    }
  };

  el.addEventListener("mousedown", e => { e.preventDefault(); e.stopPropagation(); onDown(e.clientX, e.clientY); });
  window.addEventListener("mousemove", e => { if (dragging) onMove(e.clientX, e.clientY); });
  window.addEventListener("mouseup", e => { if (dragging) onUp(e.clientX, e.clientY); });
  el.addEventListener("touchstart", e => { e.preventDefault(); e.stopPropagation(); onDown(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
  el.addEventListener("touchmove", e => { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
  el.addEventListener("touchend", e => { onUp(e.changedTouches[0].clientX, e.changedTouches[0].clientY); });
}

// ===== 涂色弹窗 =====
const cpopup = document.getElementById("cpopup");
const cpGrid = document.getElementById("cpColorGrid");

COLORS.forEach(c => {
  const dot = document.createElement("div");
  dot.className = "color-dot";
  dot.style.background = c;
  if (c === "#ffffff") dot.style.border = "2px solid #ccc";
  dot.onclick = () => { applyPieceColor(currentPiece, c); };
  cpGrid.appendChild(dot);
});
document.getElementById("cpCustomColor").addEventListener("input", e => {
  if (currentPiece !== null) applyPieceColor(currentPiece, e.target.value);
});
document.addEventListener("click", e => {
  if (!cpopup.contains(e.target) && !e.target.closest(".piece")) {
    cpopup.classList.remove("show");
  }
});

function openColorPopup(idx, cx, cy) {
  currentPiece = idx;
  cpopup.classList.add("show");
  const left = Math.min(cx, window.innerWidth - 230);
  const top = Math.min(cy + 8, window.innerHeight - 200);
  cpopup.style.left = left + "px";
  cpopup.style.top = top + "px";
}

function applyPieceColor(idx, color) {
  if (idx === null || !pieces[idx]) return;
  const p = pieces[idx];
  const ctx = p.colorCtx;
  ctx.clearRect(0, 0, p.pSize, p.pSize);
  if (color !== "clear") {
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, p.pSize, p.pSize);
  }
}

function clearPiece(idx) {
  applyPieceColor(idx, "clear");
  cpopup.classList.remove("show");
}

// ===== 模式切换 =====
function setMode(m) {
  mode = m;
  document.querySelectorAll("#toolbar .btn").forEach(b => b.classList.remove("active"));
  const map = { move: "btnMove", brush: "btnBrush", erase: "btnErase" };
  document.getElementById(map[m]).classList.add("active");
  const labels = { move: "移动碎片", brush: "✏️ 画笔", erase: "🧹 橡皮" };
  document.getElementById("modeLabel").textContent = labels[m];

  if (m === "move") {
    paintCanvas.style.pointerEvents = "none";
    paintCanvas.style.cursor = "default";
  } else {
    paintCanvas.style.pointerEvents = "auto";
    paintCanvas.style.cursor = m === "brush" ? "crosshair" : "cell";
  }
}

// ===== 画笔颜色色板 =====
const swatchRow = document.getElementById("swatchRow");
COLORS.forEach(c => {
  const dot = document.createElement("div");
  dot.style.cssText = `width:22px;height:22px;border-radius:50%;background:${c};cursor:pointer;border:2px solid ${c==="brushColor"?"#333":"transparent"};flex-shrink:0;`;
  if (c === "#ffffff") dot.style.border = "2px solid #bbb";
  dot.title = c;
  dot.onclick = () => {
    brushColor = c;
    document.getElementById("brushPreview").style.background = c;
    document.getElementById("customColor").value = (c.length === 7 && c[0] === "#") ? c : "#E24B4A";
  };
  swatchRow.appendChild(dot);
});
document.getElementById("customColor").addEventListener("input", e => {
  brushColor = e.target.value;
  document.getElementById("brushPreview").style.background = e.target.value;
});
document.getElementById("brushSize").addEventListener("input", e => {
  brushSize = +e.target.value;
  const s = Math.min(brushSize, 22);
  document.getElementById("brushPreview").style.width = s + "px";
  document.getElementById("brushPreview").style.height = s + "px";
});

// ===== 画笔事件 =====
function getCanvasPos(e) {
  const rect = paintCanvas.getBoundingClientRect();
  const scaleX = paintCanvas.width / rect.width;
  const scaleY = paintCanvas.height / rect.height;
  const src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * scaleX,
    y: (src.clientY - rect.top) * scaleY
  };
}

function drawDot(pt) {
  pCtx.beginPath();
  pCtx.arc(pt.x, pt.y, brushSize / 2, 0, Math.PI * 2);
  if (mode === "erase") {
    pCtx.globalCompositeOperation = "destination-out";
    pCtx.fillStyle = "rgba(0,0,0,1)";
  } else {
    pCtx.globalCompositeOperation = "source-over";
    pCtx.fillStyle = brushColor;
  }
  pCtx.fill();
  pCtx.globalCompositeOperation = "source-over";
}

function drawLine(from, to) {
  pCtx.beginPath();
  pCtx.moveTo(from.x, from.y);
  pCtx.lineTo(to.x, to.y);
  if (mode === "erase") {
    pCtx.globalCompositeOperation = "destination-out";
    pCtx.strokeStyle = "rgba(0,0,0,1)";
    pCtx.lineWidth = brushSize * 2;
  } else {
    pCtx.globalCompositeOperation = "source-over";
    pCtx.strokeStyle = brushColor;
    pCtx.lineWidth = brushSize;
  }
  pCtx.lineCap = "round";
  pCtx.lineJoin = "round";
  pCtx.stroke();
  pCtx.globalCompositeOperation = "source-over";
}

paintCanvas.addEventListener("mousedown", e => {
  if (showcaseDone || mode === "move") return;
  painting = true;
  lastPt = getCanvasPos(e);
  drawDot(lastPt);
});
paintCanvas.addEventListener("mousemove", e => {
  if (!painting || mode === "move") return;
  const pt = getCanvasPos(e);
  drawLine(lastPt, pt);
  lastPt = pt;
});
paintCanvas.addEventListener("mouseup", () => { painting = false; lastPt = null; });
paintCanvas.addEventListener("mouseleave", () => { painting = false; lastPt = null; });
paintCanvas.addEventListener("touchstart", e => {
  if (showcaseDone || mode === "move") return;
  e.preventDefault(); painting = true;
  lastPt = getCanvasPos(e); drawDot(lastPt);
}, { passive: false });
paintCanvas.addEventListener("touchmove", e => {
  if (!painting || mode === "move") return;
  e.preventDefault();
  const pt = getCanvasPos(e); drawLine(lastPt, pt); lastPt = pt;
}, { passive: false });
paintCanvas.addEventListener("touchend", () => { painting = false; lastPt = null; });

function clearCanvas() {
  pCtx.clearRect(0, 0, paintCanvas.width, paintCanvas.height);
}

function shiftBoard(dy) {
  boardShift = Math.max(-300, Math.min(300, boardShift + dy));
  stage.style.marginTop = boardShift + "px";
}

// ===== 展示成品 =====
function showShowcase() {
  if (!confirm("确定完成并展示成品吗？")) return;
  showcaseDone = true;
  paintCanvas.style.pointerEvents = "none";

  const sc = document.getElementById("showcaseCanvas");
  const pSize = pieces[0] ? pieces[0].pSize : 180;
  const W = pSize * 3, H = pSize * 2;
  sc.width = W; sc.height = H;
  sc.style.maxWidth = "90vw"; sc.style.maxHeight = "70vh";
  const sctx = sc.getContext("2d");
  sctx.fillStyle = "#fff";
  sctx.fillRect(0, 0, W, H);

  // 3x2 网格排列
  const grid = [[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]];
  let waiting = pieces.length;
  const tryReveal = () => { if (--waiting <= 0) document.getElementById("showcase").classList.add("show"); };

  pieces.forEach((p, i) => {
    const [gc, gr] = grid[i];
    sctx.drawImage(p.colorCanvas, gc * pSize, gr * pSize);
    const draw = () => {
      const tmp = document.createElement("canvas");
      tmp.width = pSize; tmp.height = pSize;
      tmp.getContext("2d").drawImage(p.img, 0, 0, pSize, pSize);
      sctx.drawImage(tmp, gc * pSize, gr * pSize);
      tryReveal();
    };
    if (p.img.complete && p.img.naturalWidth > 0) draw();
    else { p.img.onload = draw; p.img.onerror = tryReveal; }
  });

  // 也叠加画笔涂鸦
  // 画笔层是全白板大小，需要按比例缩放映射到成品
}

function closeShowcase() {
  document.getElementById("showcase").classList.remove("show");
}

setTimeout(buildPieces, 80);
